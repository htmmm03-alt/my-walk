<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>My Walk</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222}header{padding:14px 16px 8px;font-size:22px;font-weight:700}#map{height:58vh;min-height:420px}.panel{padding:14px 16px env(safe-area-inset-bottom)}.stats{display:flex;gap:10px;margin-bottom:12px}.stat{flex:1;background:#f6f6f6;border-radius:14px;padding:10px;text-align:center}.label{font-size:12px;color:#777}.value{font-size:20px;font-weight:700;margin-top:3px}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;margin-top:8px}#start{background:#111;color:#fff}#stop{background:#eee}#clear{background:#fff;border:1px solid #ddd}#status{font-size:13px;color:#666;margin:8px 0}.history{margin-top:14px}.history h2{font-size:16px;margin:0 0 8px}.walk{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}</style></head><body><header>My Walk</header><div id="map"></div><div class="panel"><div class="stats"><div class="stat"><div class="label">距離</div><div class="value" id="distance">0 m</div></div><div class="stat"><div class="label">時間</div><div class="value" id="time">00:00</div></div><div class="stat"><div class="label">記録</div><div class="value" id="points">0</div></div></div><div id="status">「記録開始」で歩いた道を記録します</div><button id="start">記録開始</button><button id="stop" disabled>記録終了</button><button id="clear">現在のルートを消去</button><div class="history"><h2>過去の記録</h2><div id="historyList"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([35.6812,139.7671],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let route=[],line=null,marker=null,watchId=null,startedAt=null,timerId=null,totalDistance=0;const $=id=>document.getElementById(id);function fmtTime(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function distance(a,b){const R=6371000,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p,x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function redraw(){if(line)map.removeLayer(line);if(route.length>1){line=L.polyline(route,{weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[30,30]})}if(marker)map.removeLayer(marker);if(route.length)marker=L.circleMarker(route.at(-1),{radius:7}).addTo(map)}function render(){ $('distance').textContent=totalDistance<1000?`${Math.round(totalDistance)} m`:`${(totalDistance/1000).toFixed(2)} km`;$('points').textContent=route.length;if(startedAt)$('time').textContent=fmtTime(Math.floor((Date.now()-startedAt)/1000));redraw()}function saveHistory(){if(route.length<2)return;const h=JSON.parse(localStorage.getItem('mywalk-history')||'[]');h.unshift({date:new Date().toISOString(),distance:totalDistance,seconds:Math.floor((Date.now()-startedAt)/1000),route});localStorage.setItem('mywalk-history',JSON.stringify(h.slice(0,100)));renderHistory()}function renderHistory(){const h=JSON.parse(localStorage.getItem('mywalk-history')||'[]');$('historyList').innerHTML=h.length?h.map(x=>`<div class="walk"><span>${new Date(x.date).toLocaleString('ja-JP')}<br>${(x.distance/1000).toFixed(2)} km</span><span>${fmtTime(x.seconds)}</span></div>`).join(''):'<div style="color:#888;font-size:13px">まだ記録がありません</div>'}function success(pos){const p={lat:pos.coords.latitude,lng:pos.coords.longitude};if(route.length){const d=distance(route.at(-1),p);if(d<3)return;totalDistance+=d}route.push(p);render();$('status').textContent='記録中… GPS精度 '+Math.round(pos.coords.accuracy)+'m'}function error(e){$('status').textContent='位置情報を取得できませんでした。iPhoneの位置情報設定を確認してください。'}$('start').onclick=()=>{if(!navigator.geolocation)return alert('この端末では位置情報が使えません');route=[];totalDistance=0;startedAt=Date.now();$('start').disabled=true;$('stop').disabled=false;$('status').textContent='現在地を取得しています…';timerId=setInterval(render,1000);watchId=navigator.geolocation.watchPosition(success,error,{enableHighAccuracy:true,maximumAge:3000,timeout:15000})};$('stop').onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;clearInterval(timerId);timerId=null;$('start').disabled=false;$('stop').disabled=true;if(route.length>1)saveHistory();$('status').textContent='記録を保存しました';render()};$('clear').onclick=()=>{route=[];totalDistance=0;startedAt=null;render();$('status').textContent='現在のルートを消去しました'};renderHistory();</script></body></html>
